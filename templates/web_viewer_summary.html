<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Viewer summary</title>
<meta name="theme-color" content="#0f62fe">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/pwa-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));}</script>
<style>
:root{--bg:#e9edf3;--card:#fff;--line:#b9c7d8;--head:#dce8f6;--head2:#2f5f8f;--text:#17212b;--muted:#5b6673}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line)}
.titlebox h1{margin:0;font-size:26px}.titlebox .sub{margin-top:4px;font-size:14px;color:var(--muted)}#clock{font-size:18px;color:var(--muted)}
#groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px;padding:16px}
.group-card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.group-header{background:linear-gradient(180deg,#4d7db0,#3a6a9d);color:#fff;padding:10px 14px;font-size:20px;font-weight:700}
.table-wrap{padding:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{background:var(--head);padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
tbody td{padding:8px 10px;border-bottom:1px solid #e8edf4;font-size:14px;vertical-align:top}
tbody tr:nth-child(odd){background:#fbfcfe}
tbody tr:nth-child(1),tbody tr:nth-child(2),tbody tr:nth-child(3){font-weight:700}.place{width:58px}.person{width:220px}.org{width:210px}.res{width:120px}.person-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.org-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:14px;color:var(--muted)}
@media (max-width:1100px){#groups{grid-template-columns:1fr}.person{width:200px}.org{width:180px}}
</style>
</head>
<body>
<header>
  <div class="titlebox">
    <h1 id="title">Лучшие 6 результатов по группам</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div id="clock"></div>
</header>
<div id="groups"></div>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ru-RU');}
setInterval(tick,1000);tick();
async function loadHeader(){const info=await fetch('/api/event-info').then(r=>r.json());document.getElementById('title').textContent=info.title||'Лучшие 6 результатов по группам';document.getElementById('subtitle').textContent=[info.location,info.date].filter(Boolean).join(' • ');}
async function load(){
  const data=await fetch('/api/viewer/summary').then(r=>r.json());
  const root=document.getElementById('groups');
  root.innerHTML='';
  data.forEach(group=>{
    const block=document.createElement('section');
    block.className='group-card';
    let html=`<div class="group-header">${group.group}</div>`;
    if(!group.rows||!group.rows.length){
      html+=`<div class="empty">Нет данных</div>`;
    } else {
      html+=`<div class="table-wrap"><table><thead><tr><th class="place">Место</th><th class="person">Участник</th><th class="org">Коллектив</th><th class="res">Результат</th></tr></thead><tbody>`;
      group.rows.forEach(row=>{
        html+=`<tr><td>${row.place||''}</td><td class="person-cell" title="${row.name||''}">${row.name||''}</td><td class="org-cell" title="${row.organization||''}">${row.organization||''}</td><td>${row.result||''}</td></tr>`;
      });
      html+=`</tbody></table></div>`;
    }
    block.innerHTML=html;
    root.appendChild(block);
  });
}
setInterval(load,5000);loadHeader();load();
</script>
</body>
</html>
