{% extends "base.html" %}
{% block title %}Tourism results{% endblock %}
{% block head %}{{ super() }}{% endblock %}

{% block content %}
<div class="text-center">
    <h3 id="protocol-main-title"></h3>
    <div id="protocol-subtitle" class="protocol-subtitle"></div>
    <div id="protocol-event-details" class="protocol-event-details"></div>
    <h2 id="protocol-title"></h2>
    <div id="protocol-distance" class="protocol-distance"></div>
    <div id="protocol-judging-mode" class="protocol-judging-mode"></div>
</div>

<details class="tourism-header-editor no-print" open>
    <summary>Настройка шапки протокола перед печатью</summary>
    <div class="tourism-header-editor-grid">
        <label>Название соревнования<input id="header-main-title" type="text"></label>
        <label>Подзаголовок<input id="header-subtitle" type="text"></label>
        <label>Дата<input id="header-date" type="text"></label>
        <label>Место проведения<input id="header-location" type="text"></label>
        <label>Название протокола<input id="header-protocol-title" type="text"></label>
        <label>Дистанция / дисциплина<input id="header-distance" type="text"></label>
        <label>Режим судейства<input id="header-judging-mode" type="text"></label>
        <label>Главный судья<input id="header-chief-referee" type="text"></label>
        <label>Главный секретарь<input id="header-secretary" type="text"></label>
    </div>
</details>

<div class="tourism-report-controls no-print">
    <label>
        <input type="checkbox" id="show-stage-penalties" checked>
        Показывать штрафы по этапам
    </label>
    <label class="tourism-print-option">
        Формат бумаги
        <select id="print-page-size">
            <option value="A4">A4</option>
            <option value="A3">A3</option>
        </select>
    </label>
    <label class="tourism-print-option">
        Ориентация
        <select id="print-orientation">
            <option value="landscape">Альбомная</option>
            <option value="portrait">Книжная</option>
        </select>
    </label>
    <label class="tourism-print-option">
        Этапов на листе
        <select id="print-stages-per-sheet">
            <option value="0">Авто (по формату)</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
        </select>
    </label>
    <button type="button" id="print-protocol">Печать</button>
</div>

<div id="tourism-results"></div>

<div id="protocol-signatures" class="protocol-signatures">
    <div id="protocol-chief-referee-row" class="protocol-signature-row">
        <span>Главный судья</span><span id="protocol-chief-referee"></span>
    </div>
    <div id="protocol-secretary-row" class="protocol-signature-row">
        <span>Главный секретарь</span><span id="protocol-secretary"></span>
    </div>
</div>

{% raw %}
<style>
    .tourism-protocol-group {
        margin-bottom: 32px;
        page-break-after: always;
    }

    .tourism-protocol-group:last-child {
        page-break-after: auto;
    }

    .tourism-group-title {
        margin-top: 18px;
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: bold;
    }

    .sportorg-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
    }

    .sportorg-table th,
    .sportorg-table td {
        border: 1px solid #333;
        padding: 4px 6px;
        font-size: 12px;
    }

    .sportorg-table th {
        text-align: center;
        font-weight: bold;
    }

    .sportorg-table.tourism-group-results {
        table-layout: auto;
    }

    .tourism-group-results .col-place,
    .tourism-group-results .col-bib,
    .tourism-group-results .col-time,
    .tourism-group-results .col-penalty,
    .tourism-group-results .col-result,
    .tourism-group-results .col-status,
    .tourism-group-results .col-scores { white-space: nowrap !important; }
    .tourism-group-results .col-members,
    .tourism-group-results .col-team {
        text-align: left;
        white-space: nowrap !important;
        overflow-wrap: normal !important;
        word-break: keep-all !important;
        hyphens: none !important;
        line-height: 1.15;
    }
    .tourism-group-results .stage-penalties-col {
        overflow-wrap: normal !important;
        word-break: normal !important;
        hyphens: none !important;
    }

    .text-center {
        text-align: center;
    }

    .tourism-report-controls {
        margin: 12px 0 16px 0;
        font-size: 13px;
    }

    .tourism-report-controls button {
        margin-left: 16px;
        padding: 5px 18px;
        cursor: pointer;
    }

    .tourism-print-option {
        margin-left: 16px;
    }

    .tourism-print-option select {
        margin-left: 4px;
        padding: 3px 6px;
    }

    .tourism-header-editor {
        margin: 14px 0;
        padding: 10px 12px;
        border: 1px solid #bbb;
        border-radius: 5px;
        background: #f7f7f7;
    }

    .tourism-header-editor summary {
        cursor: pointer;
        font-weight: bold;
    }

    .tourism-header-editor-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 9px 12px;
        margin-top: 12px;
    }

    .tourism-header-editor-grid label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 12px;
    }

    .tourism-header-editor-grid input {
        padding: 5px 7px;
        border: 1px solid #aaa;
        border-radius: 3px;
        font: inherit;
    }

    .protocol-subtitle,
    .protocol-event-details,
    .protocol-distance,
    .protocol-judging-mode {
        margin: 3px 0;
    }

    .protocol-subtitle {
        font-size: 16px;
    }

    .protocol-distance,
    .protocol-judging-mode {
        font-size: 13px;
    }

    .protocol-signatures {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 48px;
        margin-top: 26px;
        font-size: 12px;
    }

    .protocol-signature-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 4px;
        border-bottom: 1px solid #333;
    }

    @media (max-width: 900px) {
        .tourism-header-editor-grid {
            grid-template-columns: 1fr;
        }
    }

    body.hide-stage-penalties .stage-penalties-col {
        display: none;
    }

    @media print {
        .text-center {
            break-after: avoid;
            page-break-after: avoid;
        }

        .tourism-group-title {
            break-after: avoid;
            page-break-after: avoid;
        }

        .tourism-protocol-group {
            break-after: page;
            page-break-after: always;
        }

        .tourism-protocol-group:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .sportorg-table {
            display: table;
            width: 100%;
            table-layout: auto;
        }

        .sportorg-table thead {
            display: table-header-group;
        }

        .sportorg-table tbody {
            display: table-row-group;
        }

        .sportorg-table tr {
            break-inside: avoid;
            page-break-inside: avoid;
            white-space: normal;
        }

        .sportorg-table th,
        .sportorg-table td {
            padding: 2px 4px;
            font-size: 9px;
            overflow-wrap: anywhere;
        }

        body.print-many-stages .sportorg-table th,
        body.print-many-stages .sportorg-table td {
            padding: 1px 2px;
            font-size: 8px;
        }

        body.print-many-stages-extra .sportorg-table th,
        body.print-many-stages-extra .sportorg-table td {
            padding: 1px;
            font-size: 7px;
        }

        .protocol-signatures {
            break-inside: avoid;
            page-break-inside: avoid;
        }
    }
</style>

<script>
    var race = {% endraw %}{{ race|tojson }}{% raw %};
    racePreparation(race);

    function formatProtocolDate(value) {
        if (!value) {
            return '';
        }

        var match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (match) {
            return match[3] + '.' + match[2] + '.' + match[1];
        }

        return String(value);
    }

    function getTourismCourseNames() {
        var names = [];
        var courses = race.tourism_courses || [];

        for (var i = 0; i < courses.length; i++) {
            var name = String(courses[i].name || '').trim();
            if (name && names.indexOf(name) === -1) {
                names.push(name);
            }
        }

        return names.join(', ');
    }

    function setEditorValue(id, value) {
        var element = document.getElementById(id);
        if (element) {
            element.value = value || '';
        }
    }

    function setVisibleText(id, value) {
        var element = document.getElementById(id);
        if (!element) {
            return;
        }

        element.textContent = value || '';
        element.style.display = value ? '' : 'none';
    }

    function updateProtocolHeader() {
        var date = document.getElementById('header-date').value.trim();
        var location = document.getElementById('header-location').value.trim();
        var eventDetails = [date, location].filter(Boolean).join(', ');
        var chiefReferee = document.getElementById('header-chief-referee').value.trim();
        var secretary = document.getElementById('header-secretary').value.trim();

        setVisibleText('protocol-main-title', document.getElementById('header-main-title').value.trim());
        setVisibleText('protocol-subtitle', document.getElementById('header-subtitle').value.trim());
        setVisibleText('protocol-event-details', eventDetails);
        setVisibleText('protocol-title', document.getElementById('header-protocol-title').value.trim());
        setVisibleText('protocol-distance', document.getElementById('header-distance').value.trim());
        setVisibleText('protocol-judging-mode', document.getElementById('header-judging-mode').value.trim());
        setVisibleText('protocol-chief-referee', chiefReferee);
        setVisibleText('protocol-secretary', secretary);

        document.getElementById('protocol-chief-referee-row').style.display = chiefReferee ? '' : 'none';
        document.getElementById('protocol-secretary-row').style.display = secretary ? '' : 'none';
        document.getElementById('protocol-signatures').style.display = chiefReferee || secretary ? '' : 'none';
    }

    function initializeProtocolHeaderEditor() {
        var data = race.data || {};
        var judgingMode = race.tourism_judging_mode === 'no_penalty'
            ? 'Режим судейства: без штрафов'
            : 'Режим судейства: со штрафами';

        setEditorValue('header-main-title', data.title || data.description || '');
        setEditorValue('header-subtitle', data.title && data.description ? data.description : '');
        setEditorValue('header-date', formatProtocolDate(data.start_datetime));
        setEditorValue('header-location', data.location || '');
        setEditorValue('header-protocol-title', 'ПРОТОКОЛ РЕЗУЛЬТАТОВ — ТУРИЗМ');
        setEditorValue('header-distance', getTourismCourseNames());
        setEditorValue('header-judging-mode', judgingMode);
        setEditorValue('header-chief-referee', data.chief_referee || '');
        setEditorValue('header-secretary', data.secretary || '');

        var inputs = document.querySelectorAll('.tourism-header-editor input');
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].addEventListener('input', updateProtocolHeader);
        }

        updateProtocolHeader();
    }

    initializeProtocolHeaderEditor();

    function safeText(value) {
        if (value === null || value === undefined) {
            return '';
        }
        return String(value);
    }

    function toHHMMSSFromSec(sec) {
        sec = Number(sec || 0);
        if (!sec || sec < 0) {
            return '';
        }

        var totalSeconds = Math.floor(sec);
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        function pad(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        return pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
    }

    function getResultPersonId(result) {
        if (!result || !result.person) {
            return '';
        }

        return String(result.person.id || '');
    }

    function getResultPersonIds(result) {
        if (result && result._tourism_team_person_ids) {
            return result._tourism_team_person_ids.map(String);
        }
        var personId = getResultPersonId(result);
        return personId ? [personId] : [];
    }

    function getStageName(stageId) {
        stageId = String(stageId || '');

        if (!race.tourism_stages) {
            return '';
        }

        for (var i = 0; i < race.tourism_stages.length; i++) {
            var stage = race.tourism_stages[i];
            if (String(stage.id || '') === stageId) {
                var orderNum = stage.order_num ? String(stage.order_num) + '. ' : '';
                return orderNum + (stage.name || 'Этап');
            }
        }

        return 'Этап';
    }

    function getStageDecisionText(decision) {
        var parts = [];

        if (Number(decision.penalty_time_sec || 0) > 0) {
            parts.push('штраф ' + toHHMMSSFromSec(decision.penalty_time_sec));
        }

        if (Number(decision.penalty_points || 0) > 0) {
            parts.push('штраф ' + decision.penalty_points + ' б.');
        }

        if (Number(decision.cutoff_time_sec || 0) > 0) {
            parts.push('отсечка ' + toHHMMSSFromSec(decision.cutoff_time_sec));
        }

        if (decision.is_stage_dsq === true || decision.is_stage_dsq === 1 || decision.is_stage_dsq === '1') {
            parts.push('снят с этапа');
        }

        if (decision.comment) {
            parts.push(decision.comment);
        }

        return parts.join(', ');
    }

    function getStagePenaltiesText(result) {
        if (!race.tourism_stage_decisions || !race.tourism_stage_decisions.length) {
            return '';
        }

        var personId = getResultPersonId(result);
        if (!personId) {
            return '';
        }

        var parts = [];

        for (var i = 0; i < race.tourism_stage_decisions.length; i++) {
            var decision = race.tourism_stage_decisions[i];

            if (String(decision.person_id || '') !== personId) {
                continue;
            }

            var decisionText = getStageDecisionText(decision);
            if (!decisionText) {
                continue;
            }

            parts.push(getStageName(decision.stage_id) + ': ' + decisionText);
        }

        return parts.join('; ');
    }

    function toHHMMSSFromMsec(msec) {
        msec = Number(msec || 0);
        if (!msec || msec < 0) {
            return '';
        }

        var totalSeconds = Math.floor(msec / 1000);
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        function pad(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        return pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
    }

    function getTourismStagesSorted() {
        var stages = (race.tourism_stages || []).slice();

        stages.sort(function (a, b) {
            var aOrder = Number(a.order_num || 0);
            var bOrder = Number(b.order_num || 0);

            if (aOrder !== bOrder) {
                return aOrder - bOrder;
            }

            return String(a.name || '').localeCompare(String(b.name || ''));
        });

        return stages;
    }

    function getEffectiveStagesPerSheet() {
        var stagesPerSheet = Number(
            document.getElementById('print-stages-per-sheet').value || 0
        );
        if (stagesPerSheet) return stagesPerSheet;
        var pageSize = document.getElementById('print-page-size').value;
        var orientation = document.getElementById('print-orientation').value;
        if (pageSize === 'A3') return orientation === 'landscape' ? 8 : 6;
        return orientation === 'landscape' ? 5 : 3;
    }

    function updatePrintDensity() {
        var stageCount = getEffectiveStagesPerSheet();
        document.body.classList.toggle('print-many-stages', stageCount > 6);
        document.body.classList.toggle('print-many-stages-extra', stageCount > 10);
    }

    function getStageChunks() {
        var stages = getTourismStagesSorted();
        var stagesPerSheet = getEffectiveStagesPerSheet();

        if (stages.length <= stagesPerSheet) {
            return [stages];
        }

        var chunks = [];
        for (var index = 0; index < stages.length; index += stagesPerSheet) {
            chunks.push(stages.slice(index, index + stagesPerSheet));
        }
        return chunks;
    }

    function updatePrintPageStyle() {
        var pageSize = document.getElementById('print-page-size').value;
        var orientation = document.getElementById('print-orientation').value;
        var style = document.getElementById('tourism-print-page-style');

        if (!style) {
            style = document.createElement('style');
            style.id = 'tourism-print-page-style';
            document.head.appendChild(style);
        }

        style.textContent = '@page { size: ' + pageSize + ' ' + orientation + '; margin: 8mm; }';
        updatePrintDensity();
    }

    function getStageTitle(stage) {
        if (!stage) {
            return 'Этап';
        }

        var orderNum = Number(stage.order_num || 0);
        var name = stage.name || 'Этап';

        if (orderNum > 0) {
            return orderNum + '. ' + name;
        }

        return name;
    }

    function getStageDecisionTextForResultAndStage(result, stage) {
        if (!race.tourism_stage_decisions || !race.tourism_stage_decisions.length) {
            return '';
        }

        var personIds = getResultPersonIds(result);
        if (!personIds.length || !stage || !stage.id) {
            return '';
        }

        var latestDecision = null;

        for (var i = 0; i < race.tourism_stage_decisions.length; i++) {
            var decision = race.tourism_stage_decisions[i];

            if (personIds.indexOf(String(decision.person_id || '')) === -1) {
                continue;
            }

            if (String(decision.stage_id || '') !== String(stage.id)) {
                continue;
            }

            latestDecision = decision;
        }

        return latestDecision ? getStageDecisionText(latestDecision) : '';
    }

    function getStatusText(status) {
        var statuses = {
            1: 'OK',
            2: 'DNS',
            3: 'DNF',
            4: 'DSQ',
            5: 'MP',
            6: 'OT',
            7: 'NC',
            8: 'DQ',
            9: 'Превышено КВ',
            10: 'Не стартовал',
            11: 'Снят',
            12: 'Нет результата',
            13: 'Удалён'
        };
        return statuses[status] || safeText(status);
    }

    function isOk(result) {
        return Number(result.status) === 1;
    }

    function getGroupName(result) {
        if (result.person && result.person.group && result.person.group.name) {
            return result.person.group.name;
        }
        return 'Без группы';
    }

    function getTeamName(result) {
        if (result.person && result.person.organization && result.person.organization.name) {
            return result.person.organization.name;
        }
        return '';
    }

    function getPersonName(result) {
        if (result._tourism_team_members_text) {
            return result._tourism_team_members_text;
        }
        if (!result.person) {
            return '';
        }

        return safeText(result.person.surname) + ' ' + safeText(result.person.name);
    }

    function createTeamMembersCell(result) {
        var td = document.createElement('td');
        td.className = 'col-members';
        var names = result._tourism_team_member_names || [];
        if (!names.length) {
            td.appendChild(document.createTextNode(getPersonName(result)));
            return td;
        }

        // Состав группы печатаем в две строки: для 4 человек по 2 ФИО в строке.
        var splitAt = Math.ceil(names.length / 2);
        var lines = [names.slice(0, splitAt), names.slice(splitAt)];
        lines.forEach(function (line, index) {
            if (!line.length) return;
            if (index > 0) td.appendChild(document.createElement('br'));
            td.appendChild(document.createTextNode(line.join('; ')));
        });
        return td;
    }

    function splitTextIntoBalancedLines(text, maxLines) {
        var words = safeText(text).trim().split(/\s+/).filter(Boolean);
        if (!words.length || maxLines <= 1) return [safeText(text)];
        var totalLength = words.join(' ').length;
        var targetLength = Math.ceil(totalLength / maxLines);
        var lines = [];
        var current = '';
        words.forEach(function (word) {
            if (current && current.length + 1 + word.length > targetLength && lines.length < maxLines - 1) {
                lines.push(current);
                current = word;
            } else {
                current += (current ? ' ' : '') + word;
            }
        });
        if (current) lines.push(current);
        return lines;
    }

    function createTeamCell(result) {
        var td = document.createElement('td');
        td.className = 'col-team';
        splitTextIntoBalancedLines(getTeamName(result), 3).forEach(function (line, index) {
            if (index > 0) td.appendChild(document.createElement('br'));
            td.appendChild(document.createTextNode(line));
        });
        return td;
    }

    function getBib(result) {
        if (result._tourism_team_number) {
            return result._tourism_team_number;
        }
        if (result.person && result.person.bib) {
            return result.person.bib;
        }
        if (result.bib) {
            return result.bib;
        }
        return '';
    }

    function getResultMsec(result) {
        if (result.result_msec) {
            return Number(result.result_msec);
        }
        if (result.result_current_msec) {
            return Number(result.result_current_msec);
        }
        return 0;
    }

    function getResultText(result) {
        if (result.result_current) {
            return result.result_current;
        }
        if (result.result) {
            return result.result;
        }
        return toHHMMSSFromMsec(getResultMsec(result));
    }

    function getStartTimeText(result) {
        var start = result.start_time;
        if ((start === null || start === undefined) && result.person) {
            start = result.person.start_time;
        }
        return start === null || start === undefined ? '' : toHHMMSSFromMsec(start);
    }

    function getElapsedTimeText(result) {
        var personStart = result.person && result.person.start_time;
        var hasStart = result.start_time !== null && result.start_time !== undefined;
        hasStart = hasStart || (personStart !== null && personStart !== undefined);
        if (!hasStart || result.finish_time === null || result.finish_time === undefined) {
            return '';
        }

        // The effective start also covers a start assigned to the participant.
        var start = Number(result.start_msec !== undefined && result.start_msec !== null
            ? result.start_msec : (result.start_time !== null && result.start_time !== undefined
                ? result.start_time : personStart));
        var finish = Number(result.finish_time);
        if (!isFinite(start) || !isFinite(finish) || finish < start) {
            return '';
        }
        return toHHMMSSFromMsec(finish - start);
    }

    function getPenaltyText(result) {
        if (result.tourism_penalty_time) {
            return result.tourism_penalty_time;
        }
        if (result.penalty_time) {
            return toHHMMSSFromMsec(result.penalty_time);
        }
        if (result.tourism_penalty_points) {
            return result.tourism_penalty_points;
        }
        return '';
    }

    function getCutoffText(result) {
        if (result.tourism_cutoff_time) {
            return result.tourism_cutoff_time;
        }
        if (result.credit_time) {
            return toHHMMSSFromMsec(result.credit_time);
        }
        return '';
    }

    function compareResults(a, b) {
        var aOk = isOk(a);
        var bOk = isOk(b);

        if (aOk !== bOk) {
            return aOk ? -1 : 1;
        }

        if (aOk && bOk) {
            var aStageDsqCount = Number(a.tourism_stage_dsq_count || 0);
            var bStageDsqCount = Number(b.tourism_stage_dsq_count || 0);

            if (aStageDsqCount !== bStageDsqCount) {
                return aStageDsqCount - bStageDsqCount;
            }
        }

        var aTime = getResultMsec(a);
        var bTime = getResultMsec(b);

        if (aOk && bOk) {
            if (aTime !== bTime) {
                return aTime - bTime;
            }
        }

        return String(getPersonName(a)).localeCompare(String(getPersonName(b)));
    }

    function groupResultsByAgeGroup() {
        var grouped = {};
        var sourceResults = race.competition_type === 'tourism_group'
            ? buildTourismGroupResults()
            : race.results;

        for (var i = 0; i < sourceResults.length; i++) {
            var result = sourceResults[i];

            if (Number(result.status) === 13) {
                continue;
            }

            var groupName = getGroupName(result);
            if (!grouped[groupName]) {
                grouped[groupName] = [];
            }

            grouped[groupName].push(result);
        }

        return grouped;
    }

    function buildTourismGroupResults() {
        var personsByTeam = {};
        var resultsByTeam = {};

        (race.persons || []).forEach(function (person) {
            var teamNumber = Number(person.tourism_team_number || 0);
            if (teamNumber <= 0) return;
            if (!personsByTeam[teamNumber]) personsByTeam[teamNumber] = [];
            personsByTeam[teamNumber].push(person);
        });

        (race.results || []).forEach(function (result) {
            var teamNumber = result.person
                ? Number(result.person.tourism_team_number || 0)
                : 0;
            if (teamNumber <= 0) return;
            if (!resultsByTeam[teamNumber]) resultsByTeam[teamNumber] = [];
            resultsByTeam[teamNumber].push(result);
        });

        var teamRows = [];
        Object.keys(resultsByTeam).forEach(function (teamNumber) {
            var teamResults = resultsByTeam[teamNumber];
            var persons = (personsByTeam[teamNumber] || []).slice().sort(function (a, b) {
                return Number(a.tourism_team_leg || 0) - Number(b.tourism_team_leg || 0) ||
                    Number(a.bib || 0) - Number(b.bib || 0);
            });
            var lastResult = teamResults.slice().sort(function (a, b) {
                return Number(b.finish_time || 0) - Number(a.finish_time || 0);
            })[0];
            var row = Object.assign({}, lastResult);
            row._tourism_team_number = Number(teamNumber);
            row._tourism_team_person_ids = persons.map(function (person) {
                return String(person.id || '');
            });
            row._tourism_team_member_names = persons.map(function (person) {
                return (safeText(person.surname) + ' ' + safeText(person.name)).trim();
            }).filter(Boolean);
            row._tourism_team_members_text = row._tourism_team_member_names.join('; ');
            teamRows.push(row);
        });

        // Старые файлы без номера группы не теряем: оставляем их построчно.
        (race.results || []).forEach(function (result) {
            if (!result.person || Number(result.person.tourism_team_number || 0) <= 0) {
                teamRows.push(result);
            }
        });
        return teamRows;
    }

    function assignPlaces(results) {
        results.sort(compareResults);

        var place = 0;
        var counted = 0;
        var previousKey = null;

        for (var i = 0; i < results.length; i++) {
            var result = results[i];

            result._tourism_place = '';

            if (!isOk(result)) {
                continue;
            }

            var time = getResultMsec(result);
            if (!time || time <= 0) {
                continue;
            }

            counted += 1;

            var resultKey = Number(result.tourism_stage_dsq_count || 0) + ':' + time;
            if (previousKey === null || resultKey !== previousKey) {
                place = counted;
                previousKey = resultKey;
            }

            result._tourism_place = place;
        }

        return results;
    }

    function createCell(text) {
        var td = document.createElement('td');
        td.appendChild(document.createTextNode(safeText(text)));
        return td;
    }

    function createHeaderCell(text) {
        var th = document.createElement('th');
        th.appendChild(document.createTextNode(safeText(text)));
        return th;
    }

    function buildGroupTable(groupName, results, stages, sheetIndex, sheetCount) {
        results = assignPlaces(results);
        var isSplitStageSheet = sheetCount > 1;

        var block = document.createElement('div');
        block.className = 'tourism-protocol-group';

        var title = document.createElement('div');
        title.className = 'tourism-group-title';
        var titleText = 'Возрастная группа: ' + groupName;
        if (isSplitStageSheet) {
            var firstStage = stages.length ? getStageTitle(stages[0]) : '';
            var lastStage = stages.length ? getStageTitle(stages[stages.length - 1]) : '';
            titleText += ' — этапы, лист ' + (sheetIndex + 1) + ' из ' + sheetCount;
            if (firstStage) {
                titleText += ' (этапы ' + firstStage;
                if (lastStage && lastStage !== firstStage) {
                    titleText += ' — ' + lastStage;
                }
                titleText += ')';
            }
        }
        title.appendChild(document.createTextNode(titleText));
        block.appendChild(title);

        var table = document.createElement('table');
        table.className = 'sportorg-table';
        if (race.competition_type === 'tourism_group') {
            table.classList.add('tourism-group-results');
        }

        var thead = document.createElement('thead');
        var headerRow = document.createElement('tr');

        var leadingHeaders = isSplitStageSheet
            ? ['№']
            : [
                'Место',
                '№',
                race.competition_type === 'tourism_group' ? 'Состав группы' : 'Участник',
                'Коллектив',
                'Старт',
                'Финиш',
                'Время прохождения',
                'Отсечка'
            ];
        var leadingClasses = isSplitStageSheet
            ? ['col-bib']
            : ['col-place', 'col-bib', 'col-members', 'col-team', 'col-time', 'col-time', 'col-time', 'col-time'];
        leadingHeaders.forEach(function (title, index) {
            var th = createHeaderCell(title);
            th.className = leadingClasses[index] || '';
            headerRow.appendChild(th);
        });

        stages.forEach(function (stage) {
            var th = createHeaderCell(getStageTitle(stage));
            th.className = 'stage-penalties-col';
            headerRow.appendChild(th);
        });

        if (!isSplitStageSheet) {
            var trailingHeaders = [
                {title: 'Штраф', className: 'col-penalty'},
                {title: 'Результат', className: 'col-result'},
                {title: 'Статус', className: 'col-status'},
                {title: 'Очки', className: 'col-scores'}
            ];
            trailingHeaders.forEach(function (header) {
                var th = createHeaderCell(header.title);
                th.className = header.className;
                headerRow.appendChild(th);
            });
        }

        thead.appendChild(headerRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');

        for (var i = 0; i < results.length; i++) {
            var result = results[i];

            var tr = document.createElement('tr');

            if (isSplitStageSheet) {
                var splitBibCell = createCell(getBib(result));
                splitBibCell.className = 'col-bib';
                tr.appendChild(splitBibCell);
            } else {
                var placeCell = createCell(result._tourism_place); placeCell.className = 'col-place'; tr.appendChild(placeCell);
                var bibCell = createCell(getBib(result)); bibCell.className = 'col-bib'; tr.appendChild(bibCell);
                tr.appendChild(createTeamMembersCell(result));
                tr.appendChild(createTeamCell(result));
                [getStartTimeText(result), result.finish_time ? toHHMMSSFromMsec(result.finish_time) : '', getElapsedTimeText(result), getCutoffText(result)].forEach(function (value) {
                    var timeCell = createCell(value); timeCell.className = 'col-time'; tr.appendChild(timeCell);
                });
            }

            stages.forEach(function (stage) {
                var stagePenaltyCell = createCell(
                    getStageDecisionTextForResultAndStage(result, stage)
                );
                stagePenaltyCell.className = 'stage-penalties-col';
                tr.appendChild(stagePenaltyCell);
            });

            if (!isSplitStageSheet) {
                var penaltyCell = createCell(getPenaltyText(result)); penaltyCell.className = 'col-penalty'; tr.appendChild(penaltyCell);
                var resultCell = createCell(getResultText(result)); resultCell.className = 'col-result'; tr.appendChild(resultCell);
                var statusText = getStatusText(result.status);
                var stageDsqCount = Number(result.tourism_stage_dsq_count || 0);
                if (isOk(result) && stageDsqCount > 0) {
                    statusText = 'Снят с этапов: ' + stageDsqCount;
                }
                var statusCell = createCell(statusText); statusCell.className = 'col-status'; tr.appendChild(statusCell);
                var scoresCell = createCell(result.scores || ''); scoresCell.className = 'col-scores'; tr.appendChild(scoresCell);
            }

            tbody.appendChild(tr);
        }

        table.appendChild(tbody);
        block.appendChild(table);

        return block;
    }

    function buildGroupSummaryTable(groupName, results) {
        return buildGroupTable(groupName + ' — итоговый лист', results, [], 0, 1);
    }

    function renderTourismResults() {
        var root = document.getElementById('tourism-results');
        root.textContent = '';
        var grouped = groupResultsByAgeGroup();
        var stageChunks = getStageChunks();
        var groupNames = Object.keys(grouped).sort(function (a, b) {
            return a.localeCompare(b);
        });

        if (!groupNames.length) {
            var empty = document.createElement('p');
            empty.appendChild(document.createTextNode('Нет данных для протокола.'));
            root.appendChild(empty);
            return;
        }

        for (var i = 0; i < groupNames.length; i++) {
            var groupName = groupNames[i];
            for (var sheetIndex = 0; sheetIndex < stageChunks.length; sheetIndex++) {
                root.appendChild(buildGroupTable(
                    groupName,
                    grouped[groupName],
                    stageChunks[sheetIndex],
                    sheetIndex,
                    stageChunks.length
                ));
            }
            if (stageChunks.length > 1) {
                root.appendChild(buildGroupSummaryTable(groupName, grouped[groupName]));
            }
        }
    }

    renderTourismResults();
    updatePrintPageStyle();

    var showStagePenaltiesCheckbox = document.getElementById('show-stage-penalties');
    if (showStagePenaltiesCheckbox) {
        showStagePenaltiesCheckbox.addEventListener('change', function () {
            if (showStagePenaltiesCheckbox.checked) {
                document.body.classList.remove('hide-stage-penalties');
            } else {
                document.body.classList.add('hide-stage-penalties');
            }
        });
    }

    var printProtocolButton = document.getElementById('print-protocol');
    if (printProtocolButton) {
        printProtocolButton.addEventListener('click', function () {
            window.print();
        });
    }

    var printPageSize = document.getElementById('print-page-size');
    var printOrientation = document.getElementById('print-orientation');
    var printStagesPerSheet = document.getElementById('print-stages-per-sheet');
    function rerenderForPageFormat() {
        renderTourismResults();
        updatePrintPageStyle();
    }
    printPageSize.addEventListener('change', rerenderForPageFormat);
    printOrientation.addEventListener('change', rerenderForPageFormat);
    printStagesPerSheet.addEventListener('change', function () {
        renderTourismResults();
        updatePrintPageStyle();
    });
    window.addEventListener('beforeprint', updatePrintPageStyle);
</script>
