{% extends "base.html" %}
{% block title %}Tourism results{% endblock %}
{% block head %}{{ super() }}{% endblock %}

{% block content %}
<div class="text-center">
    <h3>{{ race.data.description }} <br>{{ race.data.start_datetime|date }} {{ race.data.location }}</h3>
    <h2>ПРОТОКОЛ РЕЗУЛЬТАТОВ — ТУРИЗМ</h2>
</div>

<div class="tourism-report-controls">
    <label>
        <input type="checkbox" id="show-stage-penalties" checked>
        Показывать штрафы по этапам
    </label>
</div>

<div id="tourism-results"></div>

{% raw %}
<style>
    .tourism-protocol-group {
        margin-bottom: 32px;
        page-break-after: always;
    }

    .tourism-protocol-group:last-child {
        page-break-after: auto;
    }

    .tourism-group-title {
        margin-top: 18px;
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: bold;
    }

    .sportorg-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
    }

    .sportorg-table th,
    .sportorg-table td {
        border: 1px solid #333;
        padding: 4px 6px;
        font-size: 12px;
    }

    .sportorg-table th {
        text-align: center;
        font-weight: bold;
    }

    .text-center {
        text-align: center;
    }

    .tourism-report-controls {
        margin: 12px 0 16px 0;
        font-size: 13px;
    }

    body.hide-stage-penalties .stage-penalties-col {
        display: none;
    }
</style>

<script>
    var race = {% endraw %}{{ race|tojson }}{% raw %};
    racePreparation(race);

    function safeText(value) {
        if (value === null || value === undefined) {
            return '';
        }
        return String(value);
    }

    function toHHMMSSFromSec(sec) {
        sec = Number(sec || 0);
        if (!sec || sec < 0) {
            return '';
        }

        var totalSeconds = Math.floor(sec);
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        function pad(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        return pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
    }

    function getResultPersonId(result) {
        if (!result || !result.person) {
            return '';
        }

        return String(result.person.id || '');
    }

    function getStageName(stageId) {
        stageId = String(stageId || '');

        if (!race.tourism_stages) {
            return '';
        }

        for (var i = 0; i < race.tourism_stages.length; i++) {
            var stage = race.tourism_stages[i];
            if (String(stage.id || '') === stageId) {
                var orderNum = stage.order_num ? String(stage.order_num) + '. ' : '';
                return orderNum + (stage.name || 'Этап');
            }
        }

        return 'Этап';
    }

    function getStageDecisionText(decision) {
        var parts = [];

        if (Number(decision.penalty_time_sec || 0) > 0) {
            parts.push('штраф ' + toHHMMSSFromSec(decision.penalty_time_sec));
        }

        if (Number(decision.penalty_points || 0) > 0) {
            parts.push('штраф ' + decision.penalty_points + ' б.');
        }

        if (Number(decision.cutoff_time_sec || 0) > 0) {
            parts.push('отсечка ' + toHHMMSSFromSec(decision.cutoff_time_sec));
        }

        if (decision.is_stage_dsq === true || decision.is_stage_dsq === 1 || decision.is_stage_dsq === '1') {
            parts.push('снят с этапа');
        }

        if (decision.comment) {
            parts.push(decision.comment);
        }

        return parts.join(', ');
    }

    function getStagePenaltiesText(result) {
        if (!race.tourism_stage_decisions || !race.tourism_stage_decisions.length) {
            return '';
        }

        var personId = getResultPersonId(result);
        if (!personId) {
            return '';
        }

        var parts = [];

        for (var i = 0; i < race.tourism_stage_decisions.length; i++) {
            var decision = race.tourism_stage_decisions[i];

            if (String(decision.person_id || '') !== personId) {
                continue;
            }

            var decisionText = getStageDecisionText(decision);
            if (!decisionText) {
                continue;
            }

            parts.push(getStageName(decision.stage_id) + ': ' + decisionText);
        }

        return parts.join('; ');
    }

    function toHHMMSSFromMsec(msec) {
        msec = Number(msec || 0);
        if (!msec || msec < 0) {
            return '';
        }

        var totalSeconds = Math.floor(msec / 1000);
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        function pad(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        return pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
    }

    function getTourismStagesSorted() {
        var stages = (race.tourism_stages || []).slice();

        stages.sort(function (a, b) {
            var aOrder = Number(a.order_num || 0);
            var bOrder = Number(b.order_num || 0);

            if (aOrder !== bOrder) {
                return aOrder - bOrder;
            }

            return String(a.name || '').localeCompare(String(b.name || ''));
        });

        return stages;
    }

    function getStageTitle(stage) {
        if (!stage) {
            return 'Этап';
        }

        var orderNum = Number(stage.order_num || 0);
        var name = stage.name || 'Этап';

        if (orderNum > 0) {
            return orderNum + '. ' + name;
        }

        return name;
    }

    function getStageDecisionTextForResultAndStage(result, stage) {
        if (!race.tourism_stage_decisions || !race.tourism_stage_decisions.length) {
            return '';
        }

        var personId = getResultPersonId(result);
        if (!personId || !stage || !stage.id) {
            return '';
        }

        var parts = [];

        for (var i = 0; i < race.tourism_stage_decisions.length; i++) {
            var decision = race.tourism_stage_decisions[i];

            if (String(decision.person_id || '') !== String(personId)) {
                continue;
            }

            if (String(decision.stage_id || '') !== String(stage.id)) {
                continue;
            }

            var decisionText = getStageDecisionText(decision);
            if (decisionText) {
                parts.push(decisionText);
            }
        }

        return parts.join('; ');
    }

    function getStatusText(status) {
        var statuses = {
            1: 'OK',
            2: 'DNS',
            3: 'DNF',
            4: 'DSQ',
            5: 'MP',
            6: 'OT',
            7: 'NC',
            8: 'DQ',
            9: 'Превышено КВ',
            10: 'Не стартовал',
            11: 'Снят',
            12: 'Нет результата',
            13: 'Удалён'
        };
        return statuses[status] || safeText(status);
    }

    function isOk(result) {
        return Number(result.status) === 1;
    }

    function getGroupName(result) {
        if (result.person && result.person.group && result.person.group.name) {
            return result.person.group.name;
        }
        return 'Без группы';
    }

    function getTeamName(result) {
        if (result.person && result.person.organization && result.person.organization.name) {
            return result.person.organization.name;
        }
        return '';
    }

    function getPersonName(result) {
        if (!result.person) {
            return '';
        }

        return safeText(result.person.surname) + ' ' + safeText(result.person.name);
    }

    function getBib(result) {
        if (result.person && result.person.bib) {
            return result.person.bib;
        }
        if (result.bib) {
            return result.bib;
        }
        return '';
    }

    function getResultMsec(result) {
        if (result.result_msec) {
            return Number(result.result_msec);
        }
        if (result.result_current_msec) {
            return Number(result.result_current_msec);
        }
        return 0;
    }

    function getResultText(result) {
        if (result.result_current) {
            return result.result_current;
        }
        if (result.result) {
            return result.result;
        }
        return toHHMMSSFromMsec(getResultMsec(result));
    }

    function getPenaltyText(result) {
        if (result.tourism_penalty_time) {
            return result.tourism_penalty_time;
        }
        if (result.penalty_time) {
            return toHHMMSSFromMsec(result.penalty_time);
        }
        if (result.tourism_penalty_points) {
            return result.tourism_penalty_points;
        }
        return '';
    }

    function getCutoffText(result) {
        if (result.tourism_cutoff_time) {
            return result.tourism_cutoff_time;
        }
        if (result.credit_time) {
            return toHHMMSSFromMsec(result.credit_time);
        }
        return '';
    }

    function compareResults(a, b) {
        var aOk = isOk(a);
        var bOk = isOk(b);

        if (aOk !== bOk) {
            return aOk ? -1 : 1;
        }

        var aTime = getResultMsec(a);
        var bTime = getResultMsec(b);

        if (aOk && bOk) {
            if (aTime !== bTime) {
                return aTime - bTime;
            }
        }

        return String(getPersonName(a)).localeCompare(String(getPersonName(b)));
    }

    function groupResultsByAgeGroup() {
        var grouped = {};

        for (var i = 0; i < race.results.length; i++) {
            var result = race.results[i];

            if (Number(result.status) === 13) {
                continue;
            }

            var groupName = getGroupName(result);
            if (!grouped[groupName]) {
                grouped[groupName] = [];
            }

            grouped[groupName].push(result);
        }

        return grouped;
    }

    function assignPlaces(results) {
        results.sort(compareResults);

        var place = 0;
        var counted = 0;
        var previousTime = null;

        for (var i = 0; i < results.length; i++) {
            var result = results[i];

            result._tourism_place = '';

            if (!isOk(result)) {
                continue;
            }

            var time = getResultMsec(result);
            if (!time || time <= 0) {
                continue;
            }

            counted += 1;

            if (previousTime === null || time !== previousTime) {
                place = counted;
                previousTime = time;
            }

            result._tourism_place = place;
        }

        return results;
    }

    function createCell(text) {
        var td = document.createElement('td');
        td.appendChild(document.createTextNode(safeText(text)));
        return td;
    }

    function createHeaderCell(text) {
        var th = document.createElement('th');
        th.appendChild(document.createTextNode(safeText(text)));
        return th;
    }

    function buildGroupTable(groupName, results) {
        results = assignPlaces(results);

        var block = document.createElement('div');
        block.className = 'tourism-protocol-group';

        var title = document.createElement('div');
        title.className = 'tourism-group-title';
        title.appendChild(document.createTextNode('Возрастная группа: ' + groupName));
        block.appendChild(title);

        var table = document.createElement('table');
        table.className = 'sportorg-table';

        var thead = document.createElement('thead');
        var headerRow = document.createElement('tr');

        [
            'Место',
            '№',
            'Участник',
            'Коллектив',
            'Старт',
            'Финиш',
            'Время',
            'Отсечка'
        ].forEach(function (title) {
            headerRow.appendChild(createHeaderCell(title));
        });

        getTourismStagesSorted().forEach(function (stage) {
            var th = createHeaderCell(getStageTitle(stage));
            th.className = 'stage-penalties-col';
            headerRow.appendChild(th);
        });

        [
            'Штраф',
            'Итог',
            'Статус',
            'Очки'
        ].forEach(function (title) {
            headerRow.appendChild(createHeaderCell(title));
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');

        for (var i = 0; i < results.length; i++) {
            var result = results[i];

            var tr = document.createElement('tr');

            tr.appendChild(createCell(result._tourism_place));
            tr.appendChild(createCell(getBib(result)));
            tr.appendChild(createCell(getPersonName(result)));
            tr.appendChild(createCell(getTeamName(result)));
            tr.appendChild(createCell(result.start_time ? toHHMMSSFromMsec(result.start_time) : ''));
            tr.appendChild(createCell(result.finish_time ? toHHMMSSFromMsec(result.finish_time) : ''));
            tr.appendChild(createCell(result.result_msec ? toHHMMSSFromMsec(result.result_msec) : ''));
            tr.appendChild(createCell(getCutoffText(result)));

            getTourismStagesSorted().forEach(function (stage) {
                var stagePenaltyCell = createCell(
                    getStageDecisionTextForResultAndStage(result, stage)
                );
                stagePenaltyCell.className = 'stage-penalties-col';
                tr.appendChild(stagePenaltyCell);
            });

            tr.appendChild(createCell(getPenaltyText(result)));
            tr.appendChild(createCell(getResultText(result)));
            tr.appendChild(createCell(getStatusText(result.status)));
            tr.appendChild(createCell(result.scores || ''));

            tbody.appendChild(tr);
        }

        table.appendChild(tbody);
        block.appendChild(table);

        return block;
    }

    function renderTourismResults() {
        var root = document.getElementById('tourism-results');
        var grouped = groupResultsByAgeGroup();
        var groupNames = Object.keys(grouped).sort(function (a, b) {
            return a.localeCompare(b);
        });

        if (!groupNames.length) {
            var empty = document.createElement('p');
            empty.appendChild(document.createTextNode('Нет данных для протокола.'));
            root.appendChild(empty);
            return;
        }

        for (var i = 0; i < groupNames.length; i++) {
            var groupName = groupNames[i];
            root.appendChild(buildGroupTable(groupName, grouped[groupName]));
        }
    }

    renderTourismResults();

    var showStagePenaltiesCheckbox = document.getElementById('show-stage-penalties');
    if (showStagePenaltiesCheckbox) {
        showStagePenaltiesCheckbox.addEventListener('change', function () {
            if (showStagePenaltiesCheckbox.checked) {
                document.body.classList.remove('hide-stage-penalties');
            } else {
                document.body.classList.add('hide-stage-penalties');
            }
        });
    }
</script>
{% endraw %}
{% endblock %}
