name: CI Tests/Lints

on:
  push:
    paths:
      - ".github/workflows/check.yml"
      - "builder.py"
      - "languages/**"
      - "pyproject.toml"
      - "sportorg/**"
      - "templates/**"
      - "tests/**"
      - "poetry.lock"
    branches: [ main ]
  pull_request:
    paths:
      - ".github/workflows/check.yml"
      - "builder.py"
      - "languages/**"
      - "pyproject.toml"
      - "sportorg/**"
      - "templates/**"
      - "tests/**"
      - "poetry.lock"
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install python dependencies
        run: pip install poetry && poetry install

      - name: Run linters
        run: poetry run poe lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Init .env
        run: cp .env.example .env

      - name: Install python dependencies
        run: pip install poetry && poetry install

      - name: Run test
        run: poetry run poe test
